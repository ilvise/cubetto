<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Box USB</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1d6fb8}a:hover{color:#124a7c}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F2EE; font-family: Nunito, sans-serif; color: #1F1D1A; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="padding: 28px 20px 0">
    <h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.5px">Il tuo box</h1>
  </div>

  <div style="margin: 16px 20px 0; background: #E3262B; border-radius: 26px; padding: 18px; display: flex; gap: 16px; align-items: center; color: #FFFFFF">
    <svg width="78" height="78" viewBox="0 0 80 80" aria-hidden="true">
      <rect x="6" y="10" width="68" height="64" rx="16" fill="#B5161B"></rect>
      <rect x="6" y="6" width="68" height="62" rx="16" fill="#FF4A4F"></rect>
      <circle cx="40" cy="42" r="15" fill="#B5161B"></circle>
      <circle cx="40" cy="42" r="9" fill="#FFFFFF" opacity="0.9"></circle>
      <circle cx="20" cy="20" r="4" fill="#FFFFFF"></circle>
      <circle cx="60" cy="20" r="4" fill="#FFD43B"></circle>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 4px; flex: 1">
      <span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 21px">FABA™ collegato</span>
      <span style="font-size: 13px; font-weight: 700; opacity: 0.95">Via USB · 1ª generazione</span>
      <div style="height: 10px; border-radius: 5px; background: rgba(255,255,255,0.3); overflow: hidden; margin-top: 6px">
        <div style="height: 10px; width: 42%; background: #FFD43B; border-radius: 5px"></div>
      </div>
      <span style="font-size: 12px; font-weight: 800">3,1 GB usati su 7,4 GB</span>
    </div>
  </div>

  <div style="margin: 14px 20px 0; background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 17px">Sto copiando «Canzoni in macchina»</span>
      <span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 15px; color: #6B6660">7/18</span>
    </div>
    <div style="height: 12px; border-radius: 6px; background: #EFEBE4; overflow: hidden">
      <div style="height: 12px; width: 39%; border-radius: 6px; background: #3C82C4"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{checks}}" as="c" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #4F4A44">
          <span style="width: 20px; height: 20px; border-radius: 10px; background: {{c.bg}}; display: flex; align-items: center; justify-content: center; flex: none">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg>
          </span>{{c.text}}</div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 8px">
    <span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 18px">Sul box</span>
    <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 0; background: #FFFFFF; font-weight: 800; font-size: 13px; color: #1F1D1A">Backup completo</button>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 20px">
    <sc-for list="{{onbox}}" as="b" hint-placeholder-count="4">
      <div style="background: #FFFFFF; border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 12px">
        <span style="width: 56px; height: 34px; border-radius: 10px; background: {{b.idBg}}; color: {{b.idFg}}; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; flex: none">{{b.id}}</span>
        <span style="flex: 1; min-width: 0; font-family: Fredoka, sans-serif; font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.name}}</span>
        <span style="font-size: 12px; font-weight: 800; color: #6B6660">{{b.size}}</span>
      </div>
    </sc-for>
  </div>

  <div style="margin: 12px 20px 0; padding: 10px 12px; border-radius: 16px; background: #FFE6CC; display: flex; gap: 10px; align-items: flex-start; font-size: 12px; font-weight: 700; color: #6A3400; line-height: 1.35">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6A3400" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18v.5"></path></svg>
    Attenzione: collegando il box FABA™ al programma originale le canzoni potrebbero essere sovrascritte.
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: #FFFFFF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; border-top: 1px solid #ECE8E1">
    <a href="Box.dc.html" aria-label="Box" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #1F1D1A; font-size: 11px; font-weight: 800">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"></rect><circle cx="12" cy="14" r="3"></circle><circle cx="8.5" cy="8" r="1"></circle></svg>Box</a>
    <a href="Scopri.dc.html" aria-label="Aggiungi" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #6B6660; font-size: 11px; font-weight: 800">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7.5 10.5L12 15l4.5-4.5"></path><path d="M5 19h14"></path></svg>Aggiungi</a>
    <a href="Main.dc.html" aria-label="Libreria" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #6B6660; font-size: 11px; font-weight: 800">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="4" height="16" rx="1"></rect><rect x="8" y="4" width="4" height="16" rx="1"></rect><path d="M13.5 5.5l3.8-1 3.2 14.5-3.8 1z"></path></svg>Libreria</a>
    <a href="ScegliId.dc.html" aria-label="Crea" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #6B6660; font-size: 11px; font-weight: 800">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="18" r="3"></circle><path d="M10 18V5l8-1.5v4L10 9"></path><path d="M19 13v6M16 16h6"></path></svg>Crea</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mine = { idBg: '#1F1D1A', idFg: '#FFD43B' };
    const orig = { idBg: '#EFEBE4', idFg: '#1F1D1A' };
    return {
      checks: [
        { text: 'Backup della vecchia cartella K1017 salvato', bg: '#2E9E5B' },
        { text: 'Spazio sufficiente (servono 41 MB)', bg: '#2E9E5B' },
        { text: '18 tracce su massimo 99', bg: '#2E9E5B' },
        { text: 'Copio solo i brani cambiati', bg: '#3C82C4' }
      ],
      onbox: [
        { id: '1016', name: 'Canzoni della nanna', size: '32 MB', ...mine },
        { id: '0200', name: 'Inglese per piccoli', size: '58 MB', ...mine },
        { id: '0016', name: 'Le canzoni degli animali (originale)', size: '94 MB', ...orig },
        { id: '0053', name: 'Il Gatto con gli Stivali (originale)', size: '88 MB', ...orig }
      ]
    };
  }
}
</script>
</body>
</html>
